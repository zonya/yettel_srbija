# Yettel Srbija — Kiosk Dashboard Card
#
# Zahteva:
#   - Yettel Srbija integracija (ovaj repozitorijum)
#   - Mushroom (HACS → Frontend) — za mushroom-template-card
#
# Upotreba:
#   Dashboard → Edit → Add Card → Manual → nalepi ovaj YAML.
#
# Klik na bilo koju pločicu otvara standardni HA "more-info" popup
# (detalji + istorija), kao na nativnim integracijama — NE otvara novu stranicu.
#
# VAŽNO — entity prefiks zavisi od imena uređaja:
#   Ovde je 'sensor.yettel_marko_*' (uređaj preimenovan u "Yettel Marko").
#   Ako se kod tebe razlikuje: Settings → Devices → klikni uređaj → senzor →
#   vidi entity_id i zameni prefiks svuda ispod (npr. yettel_381638120399).

type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    primary: "📱 {{ state_attr('sensor.yettel_marko_trenutno_stanje', 'tarifa') | default('Yettel', true) }}"
    secondary: "{% set s = states('sensor.yettel_marko_status_racuna') %}{% if s == 'nije_placen' %}Дуг: {{ states('sensor.yettel_marko_iznos_racuna') }} РСД · рок {{ states('sensor.yettel_marko_rok_placanja') }}{% elif s == 'placen' %}Рачун плаћен{% else %}{{ s }}{% endif %}"
    icon: "{% if states('sensor.yettel_marko_status_racuna') == 'nije_placen' %}mdi:alert-circle{% else %}mdi:check-circle{% endif %}"
    icon_color: "{% if states('sensor.yettel_marko_status_racuna') == 'nije_placen' %}red{% else %}green{% endif %}"
    entity: sensor.yettel_marko_iznos_racuna
    tap_action:
      action: more-info
    multiline_secondary: true
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Стање
        secondary: "{{ states('sensor.yettel_marko_trenutno_stanje') }} РСД"
        icon: mdi:cash
        icon_color: teal
        entity: sensor.yettel_marko_trenutno_stanje
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Интернет
        secondary: "{{ states('sensor.yettel_marko_internet') }}"
        icon: mdi:web
        icon_color: green
        entity: sensor.yettel_marko_internet
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Минути
        secondary: "{{ states('sensor.yettel_marko_minuti') }}"
        icon: mdi:phone
        icon_color: blue
        entity: sensor.yettel_marko_minuti
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: SMS
        secondary: "{{ states('sensor.yettel_marko_sms_poruke') }}"
        icon: mdi:message-text
        icon_color: indigo
        entity: sensor.yettel_marko_sms_poruke
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Роминг
        secondary: "{{ states('sensor.yettel_marko_roming_internet') }} GB"
        icon: mdi:earth
        icon_color: orange
        entity: sensor.yettel_marko_roming_internet
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Зап. Балкан
        secondary: "{{ states('sensor.yettel_marko_zapadni_balkan_internet') }} GB"
        icon: mdi:map-marker-radius
        icon_color: deep-orange
        entity: sensor.yettel_marko_zapadni_balkan_internet
        tap_action:
          action: more-info
