# Yettel Srbija — Kiosk Dashboard Card
#
# Zahteva:
#   - Yettel Srbija integracija (ovaj repozitorijum)
#   - Mushroom (HACS → Frontend)  — za mushroom-template-card
#
# Upotreba:
#   Dashboard → Edit → Add Card → Manual → nalepi ovaj YAML.
#
# VAŽNO — proveri tačan prefiks entiteta posle instalacije:
#   Settings → Devices → "Yettel 381638120399" → klikni senzor → vidi entity_id.
#   Ako se razlikuje, izmeni 'p' u markdown-u i 'entity:' linije ispod.
#   Za druge brojeve (Marija, treći) dupliraj ceo vertical-stack i zameni broj.

type: vertical-stack
cards:
  # ── Status računa ─────────────────────────────────────────────
  - type: markdown
    content: |-
      {% set p = 'sensor.yettel_381638120399' %}
      {% set stanje = states(p ~ '_trenutno_stanje') | float(0) %}
      {% set iznos = states(p ~ '_iznos_racuna') %}
      {% set status = states(p ~ '_status_racuna') %}
      {% set rok = states(p ~ '_rok_placanja') %}
      {% set mesec = state_attr(p ~ '_iznos_racuna', 'mesec') %}
      {% set tarifa = state_attr(p ~ '_trenutno_stanje', 'tarifa') %}

      ## 📱 {{ tarifa | default('Yettel', true) }}

      {% if status == 'nije_placen' %}
        <ha-alert alert-type="warning" title="⚠️ Рачун није плаћен">
          Износ: **{{ iznos }} РСД** · Рок: {{ rok }}
        </ha-alert>
      {% else %}
        ### ✅ Рачун плаћен
      {% endif %}

      | | |
      |---|---|
      | **Тренутно стање** | {{ stanje }} РСД |
      | **Последњи рачун** | {{ mesec }} |
      | **Износ** | {{ iznos }} РСД |
      | **Рок плаћања** | {{ rok }} |

  # ── Saobraćaj (internet / minuti / sms / roming) ──────────────
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Интернет
        secondary: "{{ states('sensor.yettel_381638120399_internet') }}"
        icon: mdi:web
        icon_color: green
      - type: custom:mushroom-template-card
        primary: Минути
        secondary: "{{ states('sensor.yettel_381638120399_minuti') }}"
        icon: mdi:phone
        icon_color: blue
      - type: custom:mushroom-template-card
        primary: SMS
        secondary: "{{ states('sensor.yettel_381638120399_sms_poruke') }}"
        icon: mdi:message-text
        icon_color: indigo
      - type: custom:mushroom-template-card
        primary: Роминг
        secondary: >-
          {{ states('sensor.yettel_381638120399_roming_internet') }} GB ·
          ЗБ {{ states('sensor.yettel_381638120399_zapadni_balkan_internet') }} GB
        icon: mdi:earth
        icon_color: orange
